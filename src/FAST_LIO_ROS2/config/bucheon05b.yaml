/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.2
        filter_size_map: 0.2
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1
            scan_line:  4
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            imu_trust_scale: 1.0  # >1.0: trust IMU less
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 360.0
            det_range: 100.0
            # This config enables phased half-plane fine voxel downsampling.
            # With filter_size_surf=0.5 and ADAPTIVE_FINE_VOXEL_SCALE=0.5 in code,
            # the back half-plane uses 0.25 m from 35 s to 68 s,
            # then the back half-plane uses 0.25 m from 75 s to 96 s,
            # then the back half-plane uses 0.25 m from 102 s to 155 s.
            # phase*_target can be "front", "back", or "total".
            phased_halfplane_fine_voxel_enable: false
            phased_halfplane_fine_voxel_leaf_size: 0.1  # explicit fine leaf size inside active phased windows (applies to "front"/"back" segments below); set <=0 to fall back to filter_size_surf * 0.5
            #phased_halfplane_segments_start_times: [315.0, 358.0, 380.0]
            #phased_halfplane_segments_end_times: [357.0, 370.0, 400.0]
            #phased_halfplane_segments_targets: ["back", "front", "back"]
            # 255-405s: "total" segment -- ramps the whole cloud between voxel_size_normal
            # and voxel_size_fine below (over voxel_ramp_duration at each boundary).
            # 460-470s: "back" segment -- only the back half-plane ramps between
            # voxel_size_normal and phased_halfplane_fine_voxel_leaf_size (0.1) above,
            # over voxel_ramp_duration at each boundary; the front half-plane stays normal.
            # (Both segments' ramps are gated by the shared voxel_size_fine_enable/
            # voxel_ramp_duration below -- set voxel_size_fine_enable: false for either
            # to fall back to the old hard step exactly at the segment boundary.)
            phased_halfplane_segments_start_times: [255.0, 460.0]
            phased_halfplane_segments_end_times: [405.0, 470.0]
            phased_halfplane_segments_targets: ["total", "back"]

            # Ramp (linear-interpolation) voxel-size transition for "total"-target
            # segments above, replacing the old hard step at segment start/end.
            # voxel_size_normal must match filter_size_surf (0.5 above) so the
            # baseline (outside every segment, or ramp_duration<=0) is unchanged.
            voxel_size_normal: 0.2
            voxel_size_fine_enable: false  # false => "total"-target segments have no effect; voxel size stays voxel_size_normal (voxel_size_fine is ignored)
            voxel_size_fine: 0.1
            voxel_ramp_duration: 5.0

            tum_trajectory_log_enable: true
            tum_trajectory_log_path: "/home/jschoi/edit_fastlio2/bucheon_260914/5degree/05_b_minimize/voxel0.2/trajectory.tum"
            extrinsic_est_en: false
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: false
            interval: -1
