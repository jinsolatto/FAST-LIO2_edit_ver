/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

        preprocess:
            lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for any other pointcloud input
            scan_line:  4
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            imu_trust_scale: 1.0  # >1.0: trust IMU less
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            # Use a finer surf-downsample leaf size inside this time window only;
            # outside the window filter_size_surf (above) applies as usual.
            phased_halfplane_fine_voxel_leaf_size: 0.25  # explicit fine leaf size for phased adaptive voxel windows; set <=0 to fall back to filter_size_surf * 0.5
            windowed_voxel_enable: true
            windowed_voxel_start_time: 290.0
            windowed_voxel_end_time: 296.0
            windowed_voxel_leaf_size: 0.2
            # Back-only-data experiment: drop every LiDAR point in the front 180 deg
            # half-plane (+X in body frame) for the given time window.
            # Outside the window,
            # all points pass through unchanged. Rejection happens at the earliest
            # possible point -- inside Preprocess::mid360_handler, before blind-distance
            # filtering -- so raw_point_count-derived columns (feats_undistort_size,
            # feats_down_size, etc.) and the new front_rejected column both reflect it
            # directly. raw_point_count itself still reports the true incoming sensor
            # count (same convention as blind_rejected).
            front_reject_enable: true
            front_reject_start_time: 10.0
            front_reject_end_time: 400.0
            # Ramp (linear-interpolation) voxel-size transition for "total"-target
            # phased_halfplane segments above, replacing the old hard step at segment
            # start/end: eases from voxel_size_normal to voxel_size_fine over the
            # voxel_ramp_duration seconds before/after each segment.
            voxel_size_normal: 0.5
            voxel_size_fine_enable: true  # false => "total"-target segments have no effect; voxel size stays voxel_size_normal (voxel_size_fine is ignored)
            voxel_size_fine: 0.25
            voxel_ramp_duration: 5.0
            tum_trajectory_log_enable: true
            tum_trajectory_log_path: "/home/jschoi/edit_fastlio2/trajectory_front_reject.tum"
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true                # true: publish Path
            effect_map_en: false         # true: publish Effects
            map_en: true                 # true: publish Map cloud
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: false      # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: false
            interval: -1                 # how many LiDAR frames saved in each pcd file;
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
