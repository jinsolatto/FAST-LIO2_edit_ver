/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.2
        filter_size_map: 0.5
        cube_side_length: 960.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 4
            scan_line:  4
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            imu_trust_scale: 7.0  # >1.0 = filter trusts IMU less; 1.0 = stock FAST-LIO2
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            phased_halfplane_fine_voxel_enable: false
            voxel_size_normal: -1.0
            voxel_size_fine_enable: false
            voxel_size_fine: 0.25
            voxel_ramp_duration: 5.0
            deskew_enable: false
            pose_trajectory_log_enable: true
            pose_trajectory_log_path: "/tmp/turtleisland_10degree_course1_siheung_pose.txt"
            tum_trajectory_log_enable: true
            tum_trajectory_log_path: "/home/jschoi/edit_fastlio2/turtleisland_260915/10degree/course1_minimize/siheung.yaml/voxel0.2/trajectory.tum"
            extrinsic_est_en:  false
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: true
            interval: -1
